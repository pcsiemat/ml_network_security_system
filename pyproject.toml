[project]
name = "ml-end-network-security-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "scikit-learn",
    "pandas",
    "numpy",
    "pymongo",
    "certifi",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ml_network_security_system*"]

[tool.uv]
link-mode = "copy"